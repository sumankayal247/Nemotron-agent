[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-agent"
version = "0.1.0"
description = "A bounded, repository-aware command-line coding agent for NVIDIA Nemotron models via OpenAI-compatible providers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "keyring>=24.0.0",
    "prompt_toolkit>=3.0.43,<4",
    "Pillow>=10.4,<13",
    "pygments>=2.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
nemotron-agent = "nemotron_agent.cli:main"
NA = "nemotron_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
